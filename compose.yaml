name: lifehub
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_APPLE_CLIENT_ID: ${VITE_APPLE_CLIENT_ID:-}
        VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:-}
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lifehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lifehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifehub -d lifehub"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment: &backend_env
      LIFEHUB_DATABASE_URL: postgresql+psycopg2://lifehub:${POSTGRES_PASSWORD}@db:5432/lifehub
      LIFEHUB_REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment: *backend_env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment: *backend_env
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
